name: Simulation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile code.py
      - name: Smoke test Pygame headless
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          env = os.environ.copy()
          env["PYTHONUNBUFFERED"] = "1"
          proc = subprocess.Popen(
              [sys.executable, "code.py"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              env=env
          )
          try:
              output, _ = proc.communicate(timeout=6)
              print(output[-5000:])
              raise SystemExit(f"Simulation exited during the six-second smoke test (code={proc.returncode}).")
          except subprocess.TimeoutExpired:
              proc.kill()
              output, _ = proc.communicate(timeout=5)
              print(output[-5000:])
              if "Traceback (most recent call last)" in output:
                  raise SystemExit("Simulation raised a Python exception.")
              print("PASS: simulation continued running during headless test")
          PY
